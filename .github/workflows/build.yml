name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Oss APK (unsigned)
        run: >
          ./gradlew :app:assembleOssRelease
          -PdisableSigning
          --no-daemon
          --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/oss/release/*.apk artifact/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: nexaproxy-oss-release
          path: artifact/
